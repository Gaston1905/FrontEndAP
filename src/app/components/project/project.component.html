<app-navbar></app-navbar>

<div id="main-container data-aos">
  <div class="container py-4 mt-5">

    <h2 class="fs-1 pt-1 font-monospace fw-bold mb-1">PROYECTOS</h2>
    <h4 class="fst-italic">A continuación podrás encontrar los proyectos en los que he trabajado</h4>
    <hr>

    <div class="album py-5 ">
      <div class="container">

        <div class="row">
          <div class="col-md-6" *ngFor="let project of projects.slice(0, visibleProjectsIndex)">
            <div class="card mb-4 box-shadow fade-in-animation">
              <img class="card-img-top" height="310" data-src="{{project.picPro}}" alt="Card image cap">
              <div class="card-body">
                <p class="card-text">{{project.titlePro}}</p>
                <p class="card-text">{{project.descPro}}</p>
                <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group">
                    <a href="{{project.linkPro}}" class="btn btn-sm btn-outline-secondary">REPOSITORIO</a>
                    <a href="{{project.urlPro}}" class="btn btn-sm btn-outline-secondary">WEB</a>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <div class="d-flex justify-content-center">
      <button type=" button" (click)="hideOn()"
        class=" rounded-circle p-4 border-light bg-transparent text-dark d-flex flex-column align-items-center">
        <span class="fs-3">VER MÁS</span>
        <i class="bi bi-chevron-double-down fs-2"></i>
      </button>
    </div>
  </div>

  <app-footer></app-footer>
